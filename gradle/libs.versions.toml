# R11 — every version pinned. Nothing uses a dynamic range.
[versions]
agp = "9.5.1"
androidxBrowser = "1.10.0"
androidbrowserhelper = "2.7.4"
androidxCore = "1.19.1"
junit = "4.13.2"

[libraries]
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidxBrowser" }
androidbrowserhelper = { module = "com.google.androidbrowserhelper:androidbrowserhelper", version.ref = "androidbrowserhelper" }
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
