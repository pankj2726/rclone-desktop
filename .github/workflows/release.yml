name: release

# P7-02 — tag push produces the signed, verified, checksummed APK.
# The keystore never touches this repo: it arrives as base64 in a repository secret
# (R3). Nothing is echoed; the decode step writes to $RUNNER_TEMP, which is discarded
# with the runner.
on:
  push:
    # Strict release tags only. A bare 'v*' pattern also matched v1.0.0-debug and
    # v1.0.0-unsigned, which fired this signed pipeline at tags that are not
    # releases (observed: run 42488977376 failed on the missing keystore, correctly).
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # X-20: attach this job to a protected environment with required reviewers so a
    # signed build cannot happen without a human approving it. Create the environment in
    # Settings -> Environments -> "release" and add yourself as a required reviewer.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # preinstalled SDK is used instead; see the note at the top of build.yml

      - name: Locate the preinstalled Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Install pinned platform and build-tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Materialise keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set; refusing to build an unsigned release."
            exit 1
          fi
          ks="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
          chmod 600 "$ks"
          echo "PANKXU_KEYSTORE_PATH=$ks" >> "$GITHUB_ENV"

      - name: Report the effective signing configuration
        run: |
          set -euo pipefail
          echo "PANKXU_KEYSTORE_PATH is ${PANKXU_KEYSTORE_PATH:+set}${PANKXU_KEYSTORE_PATH:-unset}"
          if [ -z "${PANKXU_KEYSTORE_PATH:-}" ]; then
            echo "::error::PANKXU_KEYSTORE_PATH is empty - build.gradle.kts reads exactly that"
            echo "name, so a typo here silently produces an UNSIGNED release."
            exit 1
          fi
          ls -l "$PANKXU_KEYSTORE_PATH"
          # Write to a file first: piping gradle into head kills it with SIGPIPE and, under
          # `set -o pipefail`, fails the step for no real reason (seen in run 42512920581).
          ./gradlew --no-daemon -q :app:signingReport > signing-report.txt 2>&1 || true
          grep -A4 "^Variant: release" signing-report.txt || true

      - name: Build release
        env:
          PANKXU_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PANKXU_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PANKXU_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify signature, alignment, identity
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          echo "--- release output directory ---"
          ls -l app/build/outputs/apk/release/
          # The signed artifact is app-release.apk. app-release-unsigned.apk exists only when
          # no signing config was applied, and picking it silently is how a pipeline publishes
          # an unsigned "release" (observed in run 42512509749: the first glob match was the
          # unsigned file, and apksigner reported Missing META-INF/MANIFEST.MF).
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::no signed APK at $APK - the signing config did not apply."
            echo "Files present:"; ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          "$BT/zipalign" -c -P 16 -v 4 "$APK" | tail -3
          "$BT/apksigner" verify --min-sdk-version 26 --verbose --print-certs "$APK" | tee signature.txt
          "$BT/aapt2" dump badging "$APK" | tee badging.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" signature.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" signature.txt
          # R14/X-19: the certificate must be the one whose fingerprint we published.
          EXPECTED_SHA256="$(grep -oE '^[[:space:]]*[0-9A-F:]{95}$' docs/key-fingerprint.txt | tr -d ' ')"
          if [ -z "$EXPECTED_SHA256" ]; then
            echo "::error::could not read the expected fingerprint from docs/key-fingerprint.txt"
            exit 1
          fi
          ACTUAL_SHA256="$(grep -oE 'Signer #1 certificate SHA-256 digest: [0-9a-f]+' signature.txt | awk '{print $NF}' | tr 'a-f' 'A-F' | sed 's/../&:/g;s/:$//')"
          echo "expected: $EXPECTED_SHA256"
          echo "actual:   $ACTUAL_SHA256"
          if [ "$EXPECTED_SHA256" != "$ACTUAL_SHA256" ]; then
            echo "::error::certificate fingerprint does not match docs/key-fingerprint.txt"
            exit 1
          fi
          echo "certificate matches the published fingerprint"

      - name: Checksums and SBOM
        run: |
          set -euo pipefail
          cp "$APK" "pankxu-${GITHUB_REF_NAME}.apk"
          sha256sum "pankxu-${GITHUB_REF_NAME}.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # P6-06: CycloneDX SBOM straight from the resolved dependency graph.
          ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath \
            > dependency-tree.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Release candidates are published but never look like the final thing.
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          files: |
            pankxu-*.apk
            SHA256SUMS.txt
            signature.txt
            badging.txt
            dependency-tree.txt
