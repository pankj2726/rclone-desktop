name: canary

# P7-04 as amended by roadmap v3.1 (9.2): arena.ai actively blocks automated requests.
# A refused, challenged or non-200 response is therefore recorded as UNKNOWN, never as
# Failed — a bot challenge says nothing about whether the site works for a human.
#
# This workflow never fails the build and never opens a "broken" issue. It writes a
# report and only surfaces a change of state worth a human look. The authoritative
# check is the user's monthly capture on a real device (9.4).
on:
  schedule:
    - cron: '0 6 1 * *'        # monthly; v3.1 caps automated checks at weekly, and
  workflow_dispatch:           # monthly is closer to what the roadmap actually needs

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe Arena public surface (read-only, once)
        id: probe
        run: |
          set -uo pipefail
          report="" ; changed=0
          probe() {  # $1 url  $2 label
            code=$(curl -sS -o /dev/null -m 25 -w '%{http_code}' \
                   -A 'Pankxu-canary/1.0 (availability check)' "$1" 2>/dev/null || echo 000)
            case "$code" in
              200)          state="OK" ;;
              000|403|429|503) state="UNKNOWN (blocked or unreachable, not a failure)" ;;
              404|410)      state="MISSING (worth a look)"; changed=1 ;;
              *)            state="UNEXPECTED $code (worth a look)"; changed=1 ;;
            esac
            report="${report}$2 [${code}]: ${state}\n"
          }
          probe "https://arena.ai/"              "home"
          probe "https://arena.ai/agent"         "agent"
          probe "https://arena.ai/side-by-side"  "side-by-side"
          probe "https://arena.ai/leaderboard"   "leaderboard"

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          printf '%b' "$report" | tee canary-report.txt
          {
            echo ""
            echo "Interpretation: a blocked/challenged response is UNKNOWN, not a failure."
            echo "The real verification is the monthly human capture (roadmap 9.4)."
          } >> canary-report.txt

      - name: Note a state change for a human
        if: steps.probe.outputs.changed == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('canary-report.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Canary: something changed on arena.ai (${new Date().toISOString().slice(0,10)})`,
              body: 'A probe returned a status that suggests the public surface moved.\n'
                  + 'This is not proof of an outage. Confirm with the human capture first.\n\n```\n'
                  + body + '\n```'
            });
