name: release-unsigned

# Builds the RELEASE variant with R8 minification and resource shrinking, but
# without a keystore. The output is an unsigned, aligned-intent APK: exactly the
# input that `apksigner` needs when the key holder signs locally.
#
# This exists so a release build can be produced and inspected without a secret
# ever entering the repository, and without pretending an unsigned or
# debug-signed APK is a release. The real signed pipeline is release.yml.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish under'
        required: true
        default: 'v1.0.0-unsigned'

permissions:
  contents: write

jobs:
  release-unsigned:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate the preinstalled Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Install pinned platform and build-tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble release (unsigned — no keystore present)
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Inspect the artifact
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK"
          ls -l "$APK"
          echo "--- badging ---"
          "$BT/aapt2" dump badging "$APK" | tee badging.txt | head -12
          echo "--- alignment (4-byte, uncompressed .so at 16 KB pages) ---"
          "$BT/zipalign" -c -P 16 -v 4 "$APK" | tail -2 | tee alignment.txt
          echo "--- signature status (expected: unsigned) ---"
          set +e
          "$BT/apksigner" verify --verbose "$APK" > signature.txt 2>&1
          rc=$?
          set -e
          cat signature.txt
          echo "apksigner exit: $rc (non-zero is expected for an unsigned APK)"
          echo "--- merged manifest ---"
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" > merged-manifest.txt
          printf 'permissions: %s\n' "$(grep -c 'uses-permission' merged-manifest.txt || true)"
          printf 'activity elements: %s\n' "$(grep -c 'E: activity' merged-manifest.txt || true)"
          echo "--- dependency tree (SBOM input, P6-06) ---"
          ./gradlew --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath > dependency-tree.txt
          echo "--- checksum ---"
          cp "$APK" pankxu-release-unsigned.apk
          sha256sum pankxu-release-unsigned.apk | tee SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: '${{ inputs.tag }} — unsigned release build'
          prerelease: true
          body: |
            **Unsigned release build.** R8-minified, resources shrunk, aligned — but with no
            signature, because the release key is held offline by the app's owner and never
            enters CI.

            Sign it locally before installing:

            ```bash
            zipalign -p -f 4 pankxu-release-unsigned.apk pankxu-release.apk
            apksigner sign --ks release.jks --ks-key-alias release \
              --v1-signing-enabled false --v2-signing-enabled true \
              --v3-signing-enabled true --out pankxu-release-signed.apk pankxu-release.apk
            apksigner verify --print-certs pankxu-release-signed.apk
            ```

            Or produce the signed build entirely in CI by adding the four repository
            secrets and running the `release` workflow instead
            (`KEYSTORE_BASE64`, `KEYSTORE_PASSWORD`, `KEY_ALIAS`, `KEY_PASSWORD`).

            Not installable as-is. Not a Play submission.
          files: |
            pankxu-release-unsigned.apk
            SHA256SUMS.txt
            badging.txt
            alignment.txt
            signature.txt
            merged-manifest.txt
            dependency-tree.txt
