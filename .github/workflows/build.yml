name: build

# P7-01 — every push and PR: compile, unit tests, lint. No signing, no secrets.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned build-tools and platform
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (P3-11, P3-06 allow-list)
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Assemble debug APK (Gate G3 candidate)
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Report merged manifest (P6-07)
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/36.0.0/aapt2)
          "$AAPT" dump xmltree --file AndroidManifest.xml app/build/outputs/apk/debug/app-debug.apk \
            > merged-manifest.txt || true
          grep -c "uses-permission" merged-manifest.txt || echo "0 permissions"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-build
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
            merged-manifest.txt
